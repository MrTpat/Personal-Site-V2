name: ci

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/personal-site:${{ github.ref_name }}-latest
          build-args: |
            CI=true
            GITHUB_HEAD_REF=${{ github.ref_name }}
            DEV_SITE_URL=${{ secrets.DEV_SITE_URL }}
            PROD_SITE_URL=${{ secrets.PROD_SITE_URL }}
            NETLIFY_DEPLOY_KEY=${{ secrets.NETLIFY_DEPLOY_KEY }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
