name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: yarn install --frozen-lockfile

      - name: Build with PR path prefix
        if: github.event.action != 'closed'
        run: yarn build
        env:
          # Preview is served under /Personal-Site-V2/pr-preview/pr-<number>/,
          # so assets must be built with that full prefix baked in.
          PATH_PREFIX: /Personal-Site-V2/pr-preview/pr-${{ github.event.number }}

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./public
          umbrella-dir: pr-preview
          action: auto
          comment: true
